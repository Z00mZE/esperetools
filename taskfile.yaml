version: '3'
env:
    GOFLAGS: -buildvcs=false
tasks:
  default:
    cmds:
      - task --list-all
  flash:
    cmds:
      - tinygo flash -target=esp32s3-generic -serial=usb -port=COM6 ./kvstorage/examples/typed
  flash-and-monitor:
    cmds:
      - tinygo flash -monitor -target=esp32s3-generic -serial=usb -port=COM6 ./kvstorage/examples/typed
  monitor:
    cmds:
      - tinygo monitor -target=esp32s3-generic -serial=usb -port=COM6
